<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFlow · Social</title>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.3/dist/dotlottie-wc.js" type="module"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface2: #222222;
            --accent: #e8f040;
            --accent2: #f5a623;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #2a2a2a;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1rem;
        }

        .app {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: 2rem;
        }

        .nav a {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--accent);
        }

        .profile-mini {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .page-header {
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-family: 'Syne', sans-serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .search-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .search-input {
            flex: 1;
            padding: 1rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
        }

        .search-btn {
            padding: 1rem 2rem;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }

        .feed-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .tab {
            padding: 0.5rem 1.5rem;
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: var(--surface2);
        }

        .tab.active {
            background: var(--accent);
            color: #000;
            font-weight: 600;
        }

        .post-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .post-form textarea {
            width: 100%;
            padding: 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 1rem;
            resize: none;
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-type-select {
            display: flex;
            gap: 0.5rem;
        }

        .post-type-btn {
            padding: 0.5rem 1rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .post-type-btn.active {
            background: var(--accent);
            color: #000;
        }

        .post-btn {
            padding: 0.75rem 2rem;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }

        .feed {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 5rem;
        }

        .post-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
        }

        .post-user h3 {
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
        }

        .post-time {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .post-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background: var(--accent2);
            border-radius: 30px;
            color: #000;
            font-size: 0.8rem;
            font-weight: 600;
            margin-left: auto;
        }

        .post-content {
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .post-stats {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .stat-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .stat-btn:hover {
            color: var(--accent);
        }

        .stat-btn.liked {
            color: var(--accent2);
        }

        .comments-section {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .comment {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            padding: 0.5rem;
            background: var(--surface2);
            border-radius: 8px;
        }

        .comment-user {
            font-weight: 600;
            color: var(--accent2);
        }

        .comment-input {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .comment-input input {
            flex: 1;
            padding: 0.75rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
        }

        .comment-input button {
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }

        .user-results {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 1rem;
            max-height: 300px;
            overflow-y: auto;
        }

        .user-result-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.2s;
        }

        .user-result-item:hover {
            background: var(--surface2);
        }

        .user-result-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .follow-btn {
            margin-left: auto;
            padding: 0.5rem 1rem;
            background: var(--accent);
            border: none;
            border-radius: 30px;
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }

        .follow-btn.following {
            background: var(--surface2);
            color: var(--text);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon {
            font-size: 1.3rem;
        }

        @media (max-width: 768px) {
            .nav {
                display: none;
            }
            
            .page-header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <a href="dashboard.html" class="logo">FitFlow</a>
            <div class="nav">
                <a href="dashboard.html">Dashboard</a>
                <a href="workouts.html">Workouts</a>
                <a href="progress.html">Progress</a>
                <a href="social.html" class="active">Social</a>
                <a href="profile.html">Profile</a>
            </div>
            <div class="profile-mini" onclick="window.location.href='profile.html'" id="miniAvatar">👤</div>
        </div>

        <div class="page-header">
            <h1>Social Feed</h1>
        </div>

        <div class="search-bar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search for friends...">
            <button class="search-btn" onclick="searchUsers()">Search</button>
        </div>
        <div id="searchResults" class="user-results" style="display: none;"></div>

        <div class="post-form" id="postForm">
            <textarea id="postContent" rows="3" placeholder="Share your fitness journey..."></textarea>
            <div class="post-actions">
                <div class="post-type-select">
                    <span class="post-type-btn active" onclick="selectPostType('status')">Status</span>
                    <span class="post-type-btn" onclick="selectPostType('workout')">Workout</span>
                    <span class="post-type-btn" onclick="selectPostType('achievement')">Achievement</span>
                </div>
                <button class="post-btn" onclick="createPost()">Post</button>
            </div>
        </div>

        <div class="feed-tabs">
            <span class="tab active" onclick="switchTab('feed')">Following</span>
            <span class="tab" onclick="switchTab('popular')">Popular</span>
            <span class="tab" onclick="switchTab('my')">My Posts</span>
        </div>

        <div class="feed" id="feedContainer">
            <div style="text-align: center; padding: 3rem; color: var(--text-muted);">Loading feed...</div>
        </div>

        <div class="bottom-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">🏋️</span>
                <span>Home</span>
            </a>
            <a href="workouts.html" class="nav-item">
                <span class="nav-icon">📋</span>
                <span>Workouts</span>
            </a>
            <a href="progress.html" class="nav-item">
                <span class="nav-icon">📊</span>
                <span>Progress</span>
            </a>
            <a href="social.html" class="nav-item active">
                <span class="nav-icon">👥</span>
                <span>Social</span>
            </a>
            <a href="profile.html" class="nav-item">
                <span class="nav-icon">👤</span>
                <span>Profile</span>
            </a>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        let currentPostType = 'status';
        let currentTab = 'feed';

        function selectPostType(type) {
            document.querySelectorAll('.post-type-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            currentPostType = type;
        }

        async function searchUsers() {
            const query = document.getElementById('searchInput').value;
            if (query.length < 2) return;

            try {
                const response = await fetch(`${API_BASE}/social/search/?q=${query}`, {
                    headers: { 'Authorization': `Token ${getToken()}` }
                });
                const users = await response.json();
                displaySearchResults(users);
            } catch (error) {
                console.error('Search error:', error);
            }
        }

        function displaySearchResults(users) {
            const container = document.getElementById('searchResults');
            if (users.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.innerHTML = users.map(user => `
                <div class="user-result-item">
                    <div class="user-result-avatar">${user.username[0].toUpperCase()}</div>
                    <div>${user.username}</div>
                    <button class="follow-btn" onclick="followUser(${user.id}, this)">Follow</button>
                </div>
            `).join('');
            container.style.display = 'block';
        }

        async function followUser(userId, btn) {
            try {
                const response = await fetch(`${API_BASE}/social/friends/follow/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${getToken()}`
                    },
                    body: JSON.stringify({ user_id: userId })
                });

                if (response.ok) {
                    btn.textContent = 'Following';
                    btn.classList.add('following');
                    loadFeed();
                }
            } catch (error) {
                console.error('Follow error:', error);
            }
        }

        async function createPost() {
            const content = document.getElementById('postContent').value;
            if (!content) return;

            try {
                const response = await fetch(`${API_BASE}/social/posts/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${getToken()}`
                    },
                    body: JSON.stringify({
                        post_type: currentPostType,
                        content: content
                    })
                });

                if (response.ok) {
                    document.getElementById('postContent').value = '';
                    loadFeed();
                }
            } catch (error) {
                console.error('Create post error:', error);
            }
        }

        async function loadFeed() {
            let url = `${API_BASE}/social/feed/`;
            
            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `Token ${getToken()}` }
                });
                const posts = await response.json();
                displayPosts(posts);
            } catch (error) {
                console.error('Load feed error:', error);
                displayPosts([]);
            }
        }

        function displayPosts(posts) {
            const container = document.getElementById('feedContainer');
            
            if (!posts || posts.length === 0) {
                container.innerHTML = '<div style="text-align: center; padding: 3rem; color: var(--text-muted);">No posts yet</div>';
                return;
            }

            container.innerHTML = posts.map(post => `
                <div class="post-card" data-post-id="${post.id}">
                    <div class="post-header">
                        <div class="post-avatar">${post.user.username[0].toUpperCase()}</div>
                        <div class="post-user">
                            <h3>${post.user.username}</h3>
                            <div class="post-time">${new Date(post.created_at).toLocaleDateString()}</div>
                        </div>
                        <span class="post-badge">${post.post_type}</span>
                    </div>
                    
                    <div class="post-content">${post.content}</div>
                    
                    <div class="post-stats">
                        <span class="stat-btn ${post.is_liked ? 'liked' : ''}" onclick="likePost(${post.id}, this)">
                            ❤️ ${post.likes_count || 0}
                        </span>
                        <span class="stat-btn" onclick="toggleComments(${post.id})">
                            💬 ${post.comments_count || 0}
                        </span>
                    </div>
                    
                    <div class="comments-section" id="comments-${post.id}" style="display: none;">
                        <div id="comments-list-${post.id}">
                            ${post.comments ? post.comments.map(comment => `
                                <div class="comment">
                                    <span class="comment-user">${comment.user.username}:</span>
                                    <span>${comment.content}</span>
                                </div>
                            `).join('') : ''}
                        </div>
                        
                        <div class="comment-input">
                            <input type="text" id="comment-${post.id}" placeholder="Write a comment...">
                            <button onclick="addComment(${post.id})">Send</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function likePost(postId, element) {
            try {
                const response = await fetch(`${API_BASE}/social/posts/${postId}/like/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${getToken()}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    element.innerHTML = `❤️ ${data.likes_count}`;
                    element.classList.add('liked');
                }
            } catch (error) {
                console.error('Like error:', error);
            }
        }

        function toggleComments(postId) {
            const comments = document.getElementById(`comments-${postId}`);
            comments.style.display = comments.style.display === 'none' ? 'block' : 'none';
        }

        async function addComment(postId) {
            const input = document.getElementById(`comment-${postId}`);
            const content = input.value;
            if (!content) return;

            try {
                const response = await fetch(`${API_BASE}/social/posts/${postId}/add_comment/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Token ${getToken()}`
                    },
                    body: JSON.stringify({ content })
                });

                if (response.ok) {
                    input.value = '';
                    loadFeed();
                }
            } catch (error) {
                console.error('Comment error:', error);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            loadFeed();
        }

        const token = getToken();
        if (!token) {
            window.location.href = 'login.html';
        } else {
            loadFeed();
        }
    </script>
</body>
</html>

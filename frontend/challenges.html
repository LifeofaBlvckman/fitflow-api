<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>FitFlow · Challenges</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --body-bg:#F4F4F1;--card-bg:#FFFFFF;--card-bg2:#F0F0EC;
  --sidebar-bg:#161616;--orange:#F55F2A;--orange-light:#FF7D4F;
  --orange-dim:rgba(245,95,42,.12);--orange-glow:rgba(245,95,42,.3);
  --dark:#161616;--dark-card:#1E1E1E;
  --text:#161616;--text-soft:#6C6C6C;--text-muted:#A8A8A8;
  --border:rgba(0,0,0,.07);
  --r:22px;--r-sm:14px;--r-xs:9px;--r-pill:999px;
  --shadow-sm:0 1px 4px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
  --shadow:0 2px 8px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 16px 40px rgba(0,0,0,.1);
  --shadow-orange:0 6px 20px rgba(245,95,42,.35);
  --sidebar-w:248px;
}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--body-bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--sidebar-bg);display:flex;flex-direction:column;padding:1.75rem 1rem;overflow-y:auto}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;margin-bottom:2.5rem;padding:0 .5rem}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-mark svg{width:18px;height:18px;fill:#fff}
.logo-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.2rem;font-weight:800;color:#fff;letter-spacing:-.02em}
.nav-label{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.22);padding:.875rem .75rem .4rem;display:block}
.nav-link{display:flex;align-items:center;gap:.7rem;padding:.6rem .75rem;border-radius:var(--r-sm);color:rgba(255,255,255,.45);text-decoration:none;font-size:.82rem;font-weight:500;transition:all .15s;margin-bottom:.1rem}
.nav-link .icon{font-size:.95rem;width:20px;text-align:center;flex-shrink:0}
.nav-link:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-link.active{color:#161616;background:#fff;font-weight:700}
.sidebar-footer{margin-top:auto;padding-top:1rem}
.user-pill{display:flex;align-items:center;gap:.625rem;padding:.75rem;background:rgba(255,255,255,.06);border-radius:var(--r-sm);text-decoration:none;border:1px solid rgba(255,255,255,.07);transition:background .2s}
.user-pill:hover{background:rgba(255,255,255,.1)}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:#fff;flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif}
.user-info-name{font-size:.8rem;font-weight:700;color:#fff}
.user-info-role{font-size:.65rem;color:rgba(255,255,255,.38)}
.main{padding:2rem 2rem 6rem;min-height:100vh;overflow-x:hidden}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.75rem;gap:1rem;flex-wrap:wrap}
.page-eyebrow{font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin-bottom:.3rem}
.page-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.9rem;font-weight:800;letter-spacing:-.035em;line-height:1.1;color:var(--dark)}
.page-sub{font-size:.82rem;color:var(--text-soft);margin-top:.3rem}
.topbar-right{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.4rem;padding:.55rem 1.2rem;border-radius:var(--r-pill);font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-orange{background:var(--orange);color:#fff;box-shadow:var(--shadow-orange)}
.btn-orange:hover{background:#e0521e;transform:translateY(-1px)}
.btn-ghost{background:var(--card-bg);color:var(--text-soft);border:1px solid var(--border);box-shadow:var(--shadow-sm)}
.btn-ghost:hover{background:var(--card-bg2);color:var(--text)}
.btn-dark{background:var(--dark);color:#fff}
.btn-dark:hover{background:#2a2a2a;transform:translateY(-1px)}
.btn-danger{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.15)}
.card{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-dark{background:var(--dark-card);border-radius:var(--r);box-shadow:var(--shadow-md);overflow:hidden}
.card-orange{background:var(--orange);border-radius:var(--r);overflow:hidden}
.card-pad{padding:1.4rem}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;gap:.5rem}
.card-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:.88rem;font-weight:800;color:var(--dark)}
.stat-eyebrow{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:.4rem}
.stat-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:2.8rem;font-weight:800;line-height:1;letter-spacing:-.04em}
.stat-sub{font-size:.72rem;margin-top:.3rem;opacity:.5}
.icon-badge{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.icon-badge-orange{background:var(--orange-dim)}
.icon-badge-white{background:rgba(255,255,255,.15)}
.chip{display:inline-flex;align-items:center;padding:.22rem .7rem;border-radius:var(--r-pill);font-size:.65rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.chip-orange{background:var(--orange-dim);color:var(--orange)}
.chip-dark{background:rgba(255,255,255,.12);color:rgba(255,255,255,.8)}
.chip-green{background:rgba(34,197,94,.12);color:#16a34a}
.form-group{margin-bottom:.875rem}
.form-label{display:block;font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);margin-bottom:.4rem}
.form-input{width:100%;padding:.75rem 1rem;background:var(--card-bg2);border:1.5px solid var(--border);border-radius:var(--r-sm);font-family:'DM Sans',sans-serif;font-size:.875rem;color:var(--text);outline:none;transition:all .2s}
.form-input:focus{border-color:var(--orange);background:var(--card-bg);box-shadow:0 0 0 3px var(--orange-dim)}
.form-input::placeholder{color:var(--text-muted)}
select.form-input{cursor:pointer}
.empty-state{text-align:center;padding:3rem 1.5rem}
.empty-icon{font-size:2.5rem;display:block;margin-bottom:.75rem}
.empty-state h3{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.05rem;font-weight:800;color:var(--dark);margin-bottom:.3rem}
.empty-state p{font-size:.8rem;color:var(--text-soft);margin-bottom:1.1rem}
.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--sidebar-bg);padding:.625rem 1rem calc(.625rem + env(safe-area-inset-bottom));justify-content:space-around;z-index:100}
.mob-item{display:flex;flex-direction:column;align-items:center;gap:.15rem;color:rgba(255,255,255,.35);text-decoration:none;font-size:.52rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:color .15s;min-width:44px}
.mob-item.active,.mob-item:hover{color:var(--orange)}
.mob-icon{font-size:1.1rem}
@media(max-width:960px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobile-nav{display:flex}.main{padding:1.25rem 1rem 5.5rem}.page-title{font-size:1.6rem}}
@media(max-width:600px){.main{padding:1rem .875rem 5rem}.page-title{font-size:1.45rem}.stat-num{font-size:2.2rem}}

.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:.875rem}
.ch-card{background:var(--card-bg);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:all .22s}
.ch-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.ch-stripe{height:4px}
.ch-body{padding:1.25rem}
.ch-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.75rem}
.diff-chip{padding:.2rem .65rem;border-radius:var(--r-pill);font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ch-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.05rem;font-weight:800;color:var(--dark);margin-bottom:.3rem}
.ch-desc{font-size:.77rem;color:var(--text-soft);line-height:1.55;margin-bottom:1rem}
.ch-footer{display:flex;align-items:center;justify-content:space-between}
.ch-meta{font-size:.71rem;color:var(--text-muted);font-weight:600}
.ch-join{padding:.38rem .875rem;border-radius:var(--r-pill);background:var(--orange);color:#fff;font-size:.72rem;font-weight:700;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;box-shadow:var(--shadow-orange)}
.ch-join:hover{background:#e0521e;transform:scale(1.04)}
.ch-joined{padding:.38rem .875rem;border-radius:var(--r-pill);background:rgba(16,185,129,.1);color:#10b981;font-size:.72rem;font-weight:700;border:1px solid rgba(16,185,129,.2)}
@media(max-width:480px){.ch-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="sidebar"><a href="dashboard.html" class="logo"><div class="logo-mark"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><span class="logo-text">FitFlow</span></a><span class="nav-label">Main</span><a href="dashboard.html" class="nav-link "><span class="icon">⚡</span>Dashboard</a>
<a href="workouts.html" class="nav-link "><span class="icon">🏋️</span>Workouts</a>
<a href="exercises.html" class="nav-link "><span class="icon">📋</span>Exercises</a>
<a href="progress.html" class="nav-link "><span class="icon">📈</span>Progress</a>
<a href="log-workout.html" class="nav-link "><span class="icon">➕</span>Log Workout</a><span class="nav-label">Community</span><a href="social.html" class="nav-link "><span class="icon">👥</span>Social</a>
<a href="challenges.html" class="nav-link active"><span class="icon">🏆</span>Challenges</a><div class="sidebar-footer"><a href="profile.html" class="user-pill"><div class="user-avatar" id="sidebarAvatar">?</div><div><div class="user-info-name" id="sidebarName">…</div><div class="user-info-role">Athlete · View profile</div></div></a></div></aside><main class="main">
<div class="topbar"><div><div class="page-eyebrow">Community</div><div class="page-title">Challenges</div><div class="page-sub">Compete and grow together</div></div></div>
<div id="chEl"><div class="empty-state"><span class="empty-icon">⏳</span><h3>Loading challenges…</h3></div></div>
</main></div>
<nav class="mobile-nav">
  <a href="dashboard.html" class="mob-item "><span class="mob-icon">⚡</span>Home</a>
  <a href="workouts.html" class="mob-item "><span class="mob-icon">🏋️</span>Train</a>
  <a href="log-workout.html" class="mob-item "><span class="mob-icon">➕</span>Log</a>
  <a href="progress.html" class="mob-item "><span class="mob-icon">📈</span>Stats</a>
  <a href="profile.html" class="mob-item "><span class="mob-icon">👤</span>Me</a>
</nav>
<script>
const API_BASE = 'https://fitflow-api-production-c25a.up.railway.app/api';

function getToken() { return localStorage.getItem('fitflow_token'); }
function getUser() { try { return JSON.parse(localStorage.getItem('fitflow_user')); } catch { return null; } }
function setAuth(token, user) { localStorage.setItem('fitflow_token', token); localStorage.setItem('fitflow_user', JSON.stringify(user)); }
function clearAuth() { localStorage.removeItem('fitflow_token'); localStorage.removeItem('fitflow_user'); }
function logout() { clearAuth(); location.href = 'login.html'; }

async function login(username, password) {
  const r = await fetch(`${API_BASE}/auth/login/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
  const data = await r.json();
  if (data.token) setAuth(data.token, data.user);
  return data;
}

async function register(payload) {
  const r = await fetch(`${API_BASE}/auth/register/`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const data = await r.json();
  if (data.token) setAuth(data.token, data.user);
  return data;
}

async function authFetch(path, options = {}) {
  const token = getToken();
  const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
  if (token) headers['Authorization'] = `Token ${token}`;
  const r = await fetch(`${API_BASE}${path}`, { ...options, headers });
  if (r.status === 401) { clearAuth(); location.href = 'login.html'; return null; }
  return r;
}

async function getWorkouts(params) {
  const r = await authFetch('/workouts/workouts/' + (params || ''));
  if (!r || !r.ok) return [];
  const d = await r.json();
  return d.results || d || [];
}

async function createWorkout(payload) {
  const r = await authFetch('/workouts/workouts/', { method: 'POST', body: JSON.stringify(payload) });
  if (!r) return null;
  return r.json();
}

async function addExerciseSet(payload) {
  const r = await authFetch('/workouts/sets/', { method: 'POST', body: JSON.stringify(payload) });
  if (!r) return null;
  return r.json();
}

async function getExercises(params) {
  const r = await authFetch('/workouts/exercises/' + (params || ''));
  if (!r || !r.ok) return [];
  const d = await r.json();
  return d.results || d || [];
}

async function getDashboard() {
  const r = await authFetch('/progress/dashboard/');
  if (!r || !r.ok) return {};
  return r.json();
}

async function getWeightLogs() {
  const r = await authFetch('/progress/weight/');
  if (!r || !r.ok) return [];
  const d = await r.json();
  return d.results || d || [];
}

async function logWeight(weight_kg) {
  const r = await authFetch('/progress/weight/', { method: 'POST', body: JSON.stringify({ weight_kg, date: new Date().toISOString().split('T')[0] }) });
  if (!r) return null;
  return r.json();
}

async function getPRs() {
  const r = await authFetch('/progress/prs/');
  if (!r || !r.ok) return [];
  const d = await r.json();
  return d.results || d || [];
}

async function getProfile() {
  const r = await authFetch('/auth/profile/');
  if (!r || !r.ok) return null;
  return r.json();
}

async function updateProfile(payload) {
  const r = await authFetch('/auth/profile/', { method: 'PUT', body: JSON.stringify(payload) });
  if (!r) return null;
  return r.json();
}

async function getSocialFeed() {
  const r = await authFetch('/social/feed/');
  if (!r || !r.ok) return [];
  const d = await r.json();
  return d.results || d || [];
}

async function getChallenges() {
  const r = await authFetch('/social/challenges/');
  if (!r || !r.ok) return [];
  const d = await r.json();
  return d.results || d || [];
}

if(!getToken()){location.href='login.html'}
(function(){const u=getUser();if(!u)return;const av=document.getElementById("sidebarAvatar");const nm=document.getElementById("sidebarName");if(av)av.textContent=(u.username||"?").slice(0,2).toUpperCase();if(nm)nm.textContent=u.username||"Athlete";})();

const DC={'beginner':'#10b981','intermediate':'#f59e0b','advanced':'#ef4444','expert':'#8b5cf6'};
function renderCh(cs){
  const el=document.getElementById('chEl');
  if(!cs.length){el.innerHTML='<div class="empty-state"><span class="empty-icon">🏆</span><h3>No challenges yet</h3><p>Check back soon!</p></div>';return}
  el.innerHTML='<div class="ch-grid">'+cs.map(c=>{const dc=DC[c.difficulty]||'#F55F2A';return `<div class="ch-card"><div class="ch-stripe" style="background:${dc}"></div><div class="ch-body"><div class="ch-top"><div class="diff-chip" style="background:${dc}22;color:${dc}">${c.difficulty||'Open'}</div></div><div class="ch-title">${c.title||'Challenge'}</div><div class="ch-desc">${c.description||'Join and compete!'}</div><div class="ch-footer"><span class="ch-meta">👥 ${c.participants_count||0} joined</span>${c.is_participating?'<span class="ch-joined">✓ Joined</span>':`<button class="ch-join" onclick="event.stopPropagation();joinCh(${c.id},this)">Join →</button>`}</div></div></div>`;}).join('')+'</div>';
}
async function joinCh(id,btn){try{const r=await authFetch('/social/challenges/'+id+'/join/',{method:'POST'});if(r&&r.ok)btn.outerHTML='<span class="ch-joined">✓ Joined</span>';}catch(e){}}
async function load(){try{const cs=await getChallenges();renderCh(cs);}catch(e){document.getElementById('chEl').innerHTML='<div class="empty-state"><span class="empty-icon">🏆</span><h3>Challenges unavailable</h3></div>';}}
load();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>FitFlow · Workouts</title>
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.3/dist/dotlottie-wc.js" type="module"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--surface3:#242424;--accent:#d4f542;--accent-dim:rgba(212,245,66,.07);--accent-glow:rgba(212,245,66,.18);--orange:#ff6b2b;--blue:#4f8ef7;--text:#f0f0ea;--text-muted:#5a5a5a;--text-soft:#909090;--border:rgba(255,255,255,.055);--border-accent:rgba(212,245,66,.28);--radius:22px;--radius-sm:14px;--sw:248px}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient::before{content:'';position:absolute;top:-300px;right:-200px;width:700px;height:700px;background:radial-gradient(circle,rgba(212,245,66,.05) 0%,transparent 65%)}
.ambient::after{content:'';position:absolute;bottom:-200px;left:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(255,107,43,.04) 0%,transparent 65%)}
.app{position:relative;z-index:1;display:grid;grid-template-columns:var(--sw) 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:1.75rem 1rem 1.5rem;border-right:1px solid var(--border);background:rgba(10,10,10,.93);backdrop-filter:blur(24px);animation:slideIn .4s ease both}
@keyframes slideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.logo{font-family:'Syne',sans-serif;font-size:2.1rem;font-weight:800;letter-spacing:-.02em;color:var(--accent);text-decoration:none;display:block;margin-bottom:2.5rem;line-height:1}
.logo em{color:var(--orange);font-style:normal}
.nav-label{font-size:.62rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted);padding:0 .5rem;margin:1.25rem 0 .35rem;display:block}
.nav-link{display:flex;align-items:center;gap:.75rem;padding:.68rem .875rem;border-radius:var(--radius-sm);color:var(--text-soft);text-decoration:none;font-size:.875rem;font-weight:500;transition:all .18s ease;margin-bottom:.1rem}
.nav-link .ni{width:18px;text-align:center;font-size:.95rem;flex-shrink:0}
.nav-link:hover{color:var(--text);background:var(--surface2)}
.nav-link.active{color:#000;background:var(--accent);font-weight:700}
.badge{margin-left:auto;background:var(--orange);color:#fff;font-size:.6rem;font-weight:800;padding:.1rem .45rem;border-radius:99px}
.sidebar-bottom{margin-top:auto}
.user-card{display:flex;align-items:center;gap:.75rem;padding:.75rem .875rem;background:var(--surface2);border-radius:var(--radius-sm);cursor:pointer;border:1px solid var(--border);transition:background .2s;text-decoration:none}
.user-card:hover{background:var(--surface3)}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--orange));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:#000;flex-shrink:0}
.user-name{font-size:.825rem;font-weight:600;color:var(--text)}.user-sub{font-size:.68rem;color:var(--text-muted)}
.main{padding:2.25rem 2.5rem 6rem;max-width:1060px;overflow-x:hidden}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2.25rem;gap:1rem}
.page-title{font-family:'Syne',sans-serif;font-size:2.6rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.page-sub{color:var(--text-soft);font-size:.875rem;margin-top:.4rem}
.btn{display:inline-flex;align-items:center;gap:.45rem;padding:.6rem 1.25rem;border-radius:99px;font-family:'DM Sans',sans-serif;font-size:.825rem;font-weight:700;cursor:pointer;border:none;transition:all .2s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:#c8e532;transform:translateY(-1px);box-shadow:0 6px 22px var(--accent-glow)}
.btn-ghost{background:var(--surface2);color:var(--text-soft);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--surface3);color:var(--text)}

/* Filter tabs */
.filter-row{display:flex;gap:.5rem;margin-bottom:1.5rem;flex-wrap:wrap}
.filter-tab{padding:.45rem 1.1rem;border-radius:99px;font-size:.78rem;font-weight:700;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-muted);transition:all .18s;font-family:'DM Sans',sans-serif}
.filter-tab.active,.filter-tab:hover{background:var(--accent);color:#000;border-color:var(--accent)}

/* Workout grid */
.workout-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:.875rem}

.workout-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;cursor:pointer;transition:all .25s ease;position:relative;overflow:hidden;animation:fadeUp .45s ease both}
.workout-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--orange));opacity:0;transition:opacity .3s}
.workout-card:hover{border-color:var(--border-accent);transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.4)}
.workout-card:hover::before{opacity:1}

.wc-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1rem}
.wc-date{font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted)}
.wc-badge{padding:.2rem .625rem;border-radius:99px;font-size:.68rem;font-weight:700;background:var(--surface2);color:var(--text-soft)}

.wc-title{font-family:'Syne',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:.35rem}
.wc-sub{font-size:.8rem;color:var(--text-muted);margin-bottom:1.1rem}

.wc-stats{display:flex;gap:1rem}
.wc-stat{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--text-soft)}
.wc-stat .dot{width:7px;height:7px;border-radius:50%}

.wc-lottie{position:absolute;bottom:.875rem;right:.875rem;opacity:.25}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

.empty-state{grid-column:1/-1;text-align:center;padding:4rem 2rem;color:var(--text-muted)}
.empty-state .big-icon{font-size:4rem;margin-bottom:1rem;display:block;animation:float 3s ease-in-out infinite}
.empty-state h3{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:700;margin-bottom:.5rem;color:var(--text-soft)}
.empty-state p{font-size:.875rem;margin-bottom:1.5rem}

.mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,.96);backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:.625rem 1.5rem 1.1rem;justify-content:space-around;z-index:100}
.mobile-item{display:flex;flex-direction:column;align-items:center;gap:.2rem;color:var(--text-muted);text-decoration:none;font-size:.6rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;transition:color .2s}
.mobile-item.active,.mobile-item:hover{color:var(--accent)}
.mobile-icon{font-size:1.15rem}


}

/* ── FULL MOBILE RESPONSIVE ── */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-nav{display:flex}
  .main{padding:1.25rem 1rem 5.5rem;max-width:100%}
  .page-title{font-size:1.9rem;letter-spacing:-.02em}
  .topbar{flex-direction:column;gap:.875rem;margin-bottom:1.5rem}
  .topbar-actions{width:100%;justify-content:flex-start}
  .charts-row,.bottom-row{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .panel{padding:1.1rem}
  .filter-row{overflow-x:auto;flex-wrap:nowrap;padding-bottom:.25rem;-webkit-overflow-scrolling:touch}
  .filter-row::-webkit-scrollbar{display:none}
  .workout-grid{grid-template-columns:1fr}
  .cards-grid{grid-template-columns:1fr}
  .challenges-grid{grid-template-columns:1fr}
  .profile-grid{grid-template-columns:1fr}
  .social-grid{grid-template-columns:1fr}
  .feed-layout{grid-template-columns:1fr}
  .activity-grid{grid-template-columns:1fr}
  .actions-grid{grid-template-columns:1fr 1fr}
  .muscle-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .main{padding:1rem .875rem 5rem}
  .page-title{font-size:1.6rem}
  .stats-grid{grid-template-columns:1fr}
  .stat-value{font-size:2rem}
  .actions-grid{grid-template-columns:1fr}
  .btn{font-size:.775rem;padding:.55rem 1rem}
  .topbar-actions .btn{width:100%}
  .panel-header{flex-direction:column;align-items:flex-start;gap:.5rem}
  .period-pills{align-self:flex-start}
  .wc-stats{flex-wrap:wrap;gap:.5rem}
  .chart-wrap{height:140px}
  .form-row-2{grid-template-columns:1fr}
  .profile-hero{padding:1.5rem 1rem}
  .hero-name{font-size:1.5rem}
}

</style>
</head>
<body>
<div class="ambient"></div>
<div class="app">
<aside class="sidebar">
  <a href="dashboard.html" class="logo">Fit<em>flow</em></a>
  <span class="nav-label">Main</span>
  <a href="dashboard.html" class="nav-link"><span class="ni">⚡</span> Dashboard</a>
  <a href="workouts.html"  class="nav-link active"><span class="ni">🏋️</span> Workouts</a>
  <a href="exercises.html" class="nav-link"><span class="ni">📋</span> Exercises</a>
  <a href="progress.html"  class="nav-link"><span class="ni">📈</span> Progress</a>
  <span class="nav-label">Community</span>
  <a href="social.html"     class="nav-link"><span class="ni">👥</span> Social Feed <span class="badge">3</span></a>
  <a href="challenges.html" class="nav-link"><span class="ni">🏆</span> Challenges</a>
  <div class="sidebar-bottom">
    <a href="profile.html" class="user-card">
      <div class="avatar" id="sidebarAvatar">OA</div>
      <div><div class="user-name" id="sidebarName">Athlete</div><div class="user-sub">View profile →</div></div>
    </a>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <div>
      <div class="page-title">Workouts</div>
      <div class="page-sub">Your training sessions & history</div>
    </div>
    <a href="log-workout.html" class="btn btn-primary" style="margin-top:.25rem">＋ New Workout</a>
  </div>

  <div class="filter-row">
    <button class="filter-tab active" onclick="filter(this,'all')">All</button>
    <button class="filter-tab" onclick="filter(this,'week')">This Week</button>
    <button class="filter-tab" onclick="filter(this,'month')">This Month</button>
    <button class="filter-tab" onclick="filter(this,'strength')">Strength</button>
    <button class="filter-tab" onclick="filter(this,'cardio')">Cardio</button>
  </div>

  <div class="workout-grid" id="workoutGrid">
    <div class="empty-state">
      <span class="big-icon">⏳</span>
      <h3>Loading…</h3>
      <p>Fetching your workouts</p>
    </div>
  </div>
</main>
</div>

<nav class="mobile-nav">
  <a href="dashboard.html" class="mobile-item"><span class="mobile-icon">⚡</span>Home</a>
  <a href="workouts.html"  class="mobile-item active"><span class="mobile-icon">🏋️</span>Workouts</a>
  <a href="progress.html"  class="mobile-item"><span class="mobile-icon">📈</span>Progress</a>
  <a href="social.html"    class="mobile-item"><span class="mobile-icon">👥</span>Social</a>
  <a href="profile.html"   class="mobile-item"><span class="mobile-icon">👤</span>Profile</a>
</nav>

<script>
// Use your actual Render URL - MAKE SURE THIS IS CORRECT
const API_BASE = 'https://fitflow-api-production-c25a.up.railway.app/api';
// Rest of your code stays exactly the same...
// ... (keep all your existing functions)

</script>
<script>

function getToken(){return localStorage.getItem('fitflow_token')}
function getUser(){try{return JSON.parse(localStorage.getItem('fitflow_user'))}catch{return null}}
// Auth guard
if(!localStorage.getItem('fitflow_token')){location.href='login.html'}

const u=getUser();
if(u){document.getElementById('sidebarAvatar').textContent=(u.username||'OA').substring(0,2).toUpperCase();document.getElementById('sidebarName').textContent=u.username?.split(' ')[0]||'Athlete'}

const DEMO=[
  {id:1,date:'2026-02-28',duration_minutes:52,notes:'Upper Body Push',total_sets:12,sets:[{weight_kg:80,sets:4,reps:8}]},
  {id:2,date:'2026-02-26',duration_minutes:45,notes:'Leg Day 🔥',total_sets:10,sets:[{weight_kg:100,sets:4,reps:6}]},
  {id:3,date:'2026-02-24',duration_minutes:38,notes:'Pull Session',total_sets:9,sets:[{weight_kg:70,sets:3,reps:8}]},
  {id:4,date:'2026-02-22',duration_minutes:60,notes:'Full Body',total_sets:14,sets:[{weight_kg:80,sets:4,reps:10}]},
  {id:5,date:'2026-02-20',duration_minutes:40,notes:'Core & Cardio',total_sets:8,sets:[{weight_kg:20,sets:4,reps:15}]},
  {id:6,date:'2026-02-18',duration_minutes:55,notes:'Chest & Triceps',total_sets:11,sets:[{weight_kg:70,sets:4,reps:8}]},
];
const COLORS=['#d4f542','#ff6b2b','#4f8ef7','#a78bfa','#ec4899','#34d399'];
const LOTTIES=[
  'https://lottie.host/4e5cf296-850a-404f-be32-4a01e45dfa78/UMJMEMPrNu.lottie',
  'https://lottie.host/b12c8254-f48d-42f4-a4ad-fcc2889ffd16/1FpVhxOkds.lottie',
];

function renderWorkouts(ws){
  const g=document.getElementById('workoutGrid');
  if(!ws.length){g.innerHTML=`<div class="empty-state"><span class="big-icon">🏋️</span><h3>No workouts yet</h3><p>Start crushing it today!</p><a href="log-workout.html" class="btn btn-primary">＋ Log First Workout</a></div>`;return}
  g.innerHTML=ws.map((w,i)=>{
    const vol=w.sets?w.sets.reduce((a,s)=>a+(s.weight_kg*(s.sets||1)*(s.reps||1)),0):0;
    return `<div class="workout-card" style="animation-delay:${i*.06}s" onclick="location.href='workout-detail.html?id=${w.id}'">
      <div class="wc-header">
        <div class="wc-date">${new Date(w.date).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</div>
        <div class="wc-badge" style="background:${COLORS[i%COLORS.length]}22;color:${COLORS[i%COLORS.length]}">${w.duration_minutes||'—'} min</div>
      </div>
      <div class="wc-title">${w.notes||'Workout Session'}</div>
      <div class="wc-sub">${w.total_sets||0} sets completed</div>
      <div class="wc-stats">
        <div class="wc-stat"><div class="dot" style="background:${COLORS[i%COLORS.length]}"></div>${vol>0?vol.toFixed(0)+' kg lifted':'—'}</div>
        <div class="wc-stat">💪 ${w.sets?.length||0} exercises</div>
      </div>
      <div class="wc-lottie"><dotlottie-wc src="${LOTTIES[i%2]}" style="width:56px;height:56px" autoplay loop></dotlottie-wc></div>
    </div>`;
  }).join('');
}

function filter(btn,type){
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
}

async function load(){
  const token=getToken();
  if(!token){renderWorkouts([]);return}
  try{
    const r=await fetch(`${API_BASE}/workouts/workouts/`,{headers:{'Authorization':`Token ${token}`}});
    if(r.ok){const d=await r.json();renderWorkouts(d.results||d||[])}
    else renderWorkouts([]);
  }catch(e){renderWorkouts([])}
}
load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFlow · Register</title>
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.3/dist/dotlottie-wc.js" type="module"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Same styles as login.html */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f0f;
            --surface: #1a1a1a;
            --surface2: #222222;
            --accent: #e8f040;
            --accent2: #f5a623;
            --text: #ffffff;
            --text-muted: #888888;
            --border: #2a2a2a;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow: hidden;
        }

        .background-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.6s ease;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-family: 'Syne', sans-serif;
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent);
        }

        .register-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .register-header {
            margin-bottom: 2rem;
        }

        .register-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .register-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            width: 20px;
            height: 20px;
            opacity: 0.5;
        }

        input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 16px;
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            color: var(--text);
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(232, 240, 64, 0.1);
        }

        .register-btn {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            border: none;
            border-radius: 16px;
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            color: #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
            margin: 1.5rem 0;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(232, 240, 64, 0.2);
        }

        .error {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            border-radius: 12px;
            padding: 0.75rem;
            color: #ff4444;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 1.5rem;
            display: none;
        }

        .error.show {
            display: block;
        }

        .login-link {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .login-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <dotlottie-wc 
            src="https://lottie.host/b12c8254-f48d-42f4-a4ad-fcc2889ffd16/1FpVhxOkds.lottie" 
            style="width: 100%; height: 100%;" autoplay loop>
        </dotlottie-wc>
    </div>

    <div class="container">
        <div class="logo">
            <h1>fit<span style="color: var(--accent2);">flow</span></h1>
            <p>Start your fitness journey today</p>
        </div>

        <div class="register-card">
            <div class="register-header">
                <h2>Create account</h2>
                <p>Join the FitFlow community</p>
            </div>

            <div class="error" id="error"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <div class="input-icon">👤</div>
                        <input type="text" id="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-wrapper">
                        <div class="input-icon">📧</div>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <div class="input-icon">🔒</div>
                        <input type="password" id="password" placeholder="Create a password" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <div class="input-icon">✓</div>
                        <input type="password" id="password2" placeholder="Confirm your password" required>
                    </div>
                </div>

                <button type="submit" class="register-btn" id="registerBtn">
                    <span>Create Account</span>
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="login.html">Log in</a>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                password2: document.getElementById('password2').value
            };
            
            const errorDiv = document.getElementById('error');
            errorDiv.classList.remove('show');
            
            if (userData.password !== userData.password2) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.add('show');
                return;
            }
            
            try {
                const result = await register(userData);
                if (result.token) {
                    window.location.href = 'dashboard.html';
                } else {
                    errorDiv.textContent = 'Registration failed. Username may already exist.';
                    errorDiv.classList.add('show');
                }
            } catch (error) {
                errorDiv.textContent = 'Registration failed. Please try again.';
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
